name: Metrics

on:
  schedule:
    - cron: "0 18 * * *"   # 매일 03:00 KST
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # 1. 프로필 요약 + 기여 캘린더 (기존 profile-details 카드 대체)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          filename: assets/metrics.svg
          base: header, activity, community, repositories
          config_timezone: Asia/Seoul
          extras_css: |
            svg { background: #0d1117; color: #8b949e; }
            h2, h3 { color: #58a6ff !important; }
            h2 svg, h3 svg, .field svg { fill: #8b949e !important; }
            b, strong, .field > span > b { color: #c9d1d9 !important; }
            :root {
              --color-calendar-graph-day-bg: #161b22;
              --color-calendar-graph-day-border: rgba(255,255,255,0.05);
              --color-calendar-graph-day-L1-bg: #0e4429;
              --color-calendar-graph-day-L2-bg: #006d32;
              --color-calendar-graph-day-L3-bg: #26a641;
              --color-calendar-graph-day-L4-bg: #39d353;
            }
          template: classic
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # 2. 언어 통계 (기존 stats 카드 대체)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          filename: assets/metrics-languages.svg
          base: ""
          config_timezone: Asia/Seoul
          extras_css: |
            svg { background: #0d1117; color: #8b949e; }
            h2, h3 { color: #58a6ff !important; }
            h2 svg, h3 svg, .field svg { fill: #8b949e !important; }
            b, strong, .field > span > b { color: #c9d1d9 !important; }
            :root {
              --color-calendar-graph-day-bg: #161b22;
              --color-calendar-graph-day-border: rgba(255,255,255,0.05);
              --color-calendar-graph-day-L1-bg: #0e4429;
              --color-calendar-graph-day-L2-bg: #006d32;
              --color-calendar-graph-day-L3-bg: #26a641;
              --color-calendar-graph-day-L4-bg: #39d353;
            }
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_sections: most-used

      # 3. 활동 시간대 (기존 productive-time 카드 대체)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          filename: assets/metrics-habits.svg
          base: ""
          config_timezone: Asia/Seoul
          extras_css: |
            svg { background: #0d1117; color: #8b949e; }
            h2, h3 { color: #58a6ff !important; }
            h2 svg, h3 svg, .field svg { fill: #8b949e !important; }
            b, strong, .field > span > b { color: #c9d1d9 !important; }
            :root {
              --color-calendar-graph-day-bg: #161b22;
              --color-calendar-graph-day-border: rgba(255,255,255,0.05);
              --color-calendar-graph-day-L1-bg: #0e4429;
              --color-calendar-graph-day-L2-bg: #006d32;
              --color-calendar-graph-day-L3-bg: #26a641;
              --color-calendar-graph-day-L4-bg: #39d353;
            }
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_charts: yes
          plugin_habits_facts: no
